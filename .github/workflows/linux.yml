# Sestavení a testy na Linuxu (Ubuntu) – hostované runnery GitHubu, bez WSL.
# Živé testy (--ignored) běží proti Dockeru samotného runneru (/var/run/docker.sock).
# Balíček tar.gz (scripts/package-linux.sh) se nahraje jako artefakt. Na tag v* se přiloží
# k releasu, který vytváří workflow build (release.ps1/release.yml); tady se jen nahrávají soubory.
name: linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Závislosti
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Sestavení
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Testy
        run: cargo test --locked
      - name: Živé testy proti Dockeru runneru
        run: cargo test --locked host::local -- --ignored
      - name: Balíček (tar.gz)
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          fi
          scripts/package-linux.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-container-desktop-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # Oprávnění k zápisu jen tady a jen na tag; release vytváří workflow build.
  release-upload:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wsl-container-desktop-linux
          path: dist
      - name: Přiložit k releasu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # release zakládá workflow build; počkáme (max. ~10 min), až bude existovat
          for i in $(seq 1 60); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            [ "$i" -lt 60 ] || { echo "release $TAG neexistuje" >&2; exit 1; }
            sleep 10
          done
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
