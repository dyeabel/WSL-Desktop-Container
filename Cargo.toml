[package]
name = "wls-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop aplikace pro správu Dockeru běžícího ve WSL distribuci"

default-run = "wls-desktop"

[[bin]]
name = "wls-desktop"
path = "src/main.rs"

# docker.exe pro Windows – předává příkazy Dockeru ve WSL
[[bin]]
name = "docker"
path = "src/shim/docker.rs"

[dependencies]
eframe = "0.31"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
egui-phosphor = "0.9"
tray-icon = "0.26.1"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security_Cryptography"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
